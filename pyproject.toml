[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fasterwam"
version = "0.1.0"
description = "Faster-WAM: a world-model-centric world action model with a single-layer action expert"
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.10"
dependencies = [
  "accelerate==1.12.0",
  "av==16.0.1",
  "datasets==3.6.0",
  "deepspeed==0.18.5",
  "einops==0.8.1",
  "huggingface-hub==0.29.2",
  "hydra-core==1.3.2",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
  "jsonlines==4.0.0",
  "modelscope==1.34.0",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "packaging>=24",
  "pandas==2.2.3",
  "pillow==12.0.0",
  "pyarrow==23.0.0",
  "regex==2025.11.3",
  "rich==14.2.0",
  "safetensors==0.5.3",
  "torch==2.7.1",
  "torchcodec==0.5",
  "torchvision==0.22.1",
  "tqdm==4.66.5",
  "transformers==4.49.0",
  "typing-extensions>=4.12",
  "wandb==0.23.1",
]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fasterwam*"]
